# Nav2 baseline for the TidyBot++ holonomic base.
#
# Trimmed from nav2_bringup/params/nav2_params.yaml (nav2 1.1.20). Removed:
# amcl (ground-truth odom, map == odom), smoother_server, waypoint_follower,
# robot_state_publisher, and bt_navigator's plugin_lib_names (bt_navigator.cpp
# declares the same list as its default). velocity_smoother is removed on
# purpose and not just unused: it would smooth this controller's output and not
# the stage 3 one, and stage 4 measures jerk.
#
# robot_radius and the velocity limits are repeated from nav/scene.py and
# nav/mppi.py MPPIConfig. scripts/gen_world.py asserts they still agree.

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    # Matches the 30 Hz the stage 3 planner publishes at. If MPPI cannot hold it,
    # that is a stage 4 measurement (p50/p99 solve time), not a misconfiguration.
    controller_frequency: 30.0
    min_x_velocity_threshold: 0.001
    # stock is 0.5, which zeroes every lateral command below 0.5 m/s. On a
    # holonomic base that deletes strafing entirely.
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # nav/metrics.py judges arrival at 0.15 m. Both planners must be held to
      # the same line or the success rate compares two different questions.
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # 75 * 0.0334 = 2.51 s, the same horizon as MPPIConfig (T=25, dt=0.1).
      # model_dt must be >= 1/controller_frequency or MPPI refuses to configure:
      # "Controller period more then model dt". 1/30 = 0.03333, hence 0.0334.
      # Nav2's own default is 56 * 0.05 = 2.8 s at 20 Hz; horizon length decides
      # whether a planner sees out of the U trap, so it is matched deliberately.
      # Sample count is left at Nav2's default (ours is K=512): that is each
      # planner's own budget, and solve time is a measured metric.
      time_steps: 75
      model_dt: 0.0334
      batch_size: 2000
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      vx_max: 0.5
      vx_min: -0.5
      vy_max: 0.5
      wz_max: 1.0
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "Omni"
      visualize: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      # PreferForwardCritic is dropped: a powered-caster base has no front, and
      # the critic would penalise exactly the strafing this robot is for.
      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5
        critical_weight: 20.0
        consider_footprint: false
        collision_cost: 10000.0
        collision_margin_distance: 0.1
        near_goal_distance: 0.5
        # These two must equal the local costmap's inflation_layer below. The
        # critic reconstructs distance from cost using them; if they differ it
        # scores against a field that does not exist.
        inflation_radius: 0.45
        cost_scaling_factor: 3.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      # The stage 3 planner reads this topic. 10 Hz is the lidar rate; solving at
      # 30 Hz just reuses the same grid three times, which is correct.
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      # stock is 3x3. The 2.5 s horizon reaches 1.25 m and the lookahead point
      # sits 0.75 m out, so a +-1.5 m window clips both.
      width: 6
      height: 6
      resolution: 0.05
      # == nav.scene.ROBOT_RADIUS. The real footprint is the 0.4814 m square
      # (circumscribed 0.3404), but nav/mppi.py bakes its cost field at 0.35;
      # a polygon here would give Nav2 a thinner robot than the challenger.
      robot_radius: 0.35
      # stock is voxel_layer; the sensor is a single-ring 2D lidar.
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # stock is 0.55. The corridor half-width is 0.60 m, so 0.55 leaves a
        # 0.05 m zero-cost band and swallows the 1.05 m pillar gaps whole.
        inflation_radius: 0.45
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.35
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""      # set by nav2.launch.py from the installed share dir

planner_server:
  ros__parameters:
    use_sim_time: True
    # The default BT replans at 1 Hz; 20.0 only produces "planner missed rate"
    # warnings for a rate nothing asks for.
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      # SmacPlanner2D emits no orientations; the omni base does not need one and
      # forcing the final approach heading would add a spin at every goal.
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

behavior_server:
  ros__parameters:
    use_sim_time: True
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

# Stage 3. Only read when nav2.launch.py runs with controller:=mppi; the MPPI
# weights themselves are not here, they stay in nav/mppi.py MPPIConfig where
# they were measured. gen_world.py checks the two agree.
mppi_controller:
  ros__parameters:
    use_sim_time: True
    # == 1 / MPPIConfig.dt. step() shifts the warm start by one horizon step per
    # call, so solving faster than this burns the horizon; cmd_vel still goes
    # out at 30 Hz, holding the latest command.
    solve_frequency: 10.0
    publish_frequency: 30.0
    K: 512
    lookahead_dist: 0.75        # RunConfig: 6/6 acceptance pairs, 1.25+ cuts the doorway corner
    goal_switch_dist: 0.75
    xy_goal_tolerance: 0.15     # same line as controller_server's general_goal_checker
    yaw_goal_tolerance: 0.25
    progress_radius: 0.5        # same rule as nav2_controller::SimpleProgressChecker
    progress_time: 10.0
    viz_samples: 24
    costmap_topic: /local_costmap/costmap
    costmap_frame: odom
    base_frame: base_link
    log_timing: true
