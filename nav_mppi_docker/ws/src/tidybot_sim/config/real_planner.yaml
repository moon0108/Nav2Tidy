# 실기 모니터링 모드의 planner. 내 PC(컨테이너)에서 돌고, 동료 PC 의 /map 을 구독한다.
#
# 이 파일은 **시뮬과 무관하다**. use_sim_time 은 전부 false -- 실기에는 /clock 이 없다
# (실측 확인: 도메인 25 에 /clock 토픽 0 개).
#
# map_server 는 띄우지 않는다. 동료 PC 의 /map 이 transient local 이라 늦게 붙어도 받는다.
# controller_server 와 bt_navigator 도 띄우지 않는다 -- 그 둘은 goal 이 없어도
# /cmd_vel 발행자를 만들어, 실기에서 "발행자 1개" 조건을 깬다.
#
# 토픽·노드 이름 충돌 없음 (2026-10-02 실측): 동료 쪽에 /global_costmap* 토픽 0 개,
# planner_server / lifecycle_manager_nav 노드 0 개.

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      # 지도 바깥(건물 외부)이 모름(-1)으로 들어와 있고, 벽 틈에서 빈 칸이 모름 칸과
      # 바로 맞닿은 곳이 있다. true 면 A* 가 그 틈으로 새어 건물 밖을 지나는 경로를
      # 낸다 (탐색 담당 보고, 2026-10-28). MPPI 쪽 unknown: free 는 **그대로 둔다** --
      # SLAM 지도에는 관측됐지만 안 찍힌 칸이 있고, 그것을 lethal 로 보면 MPPI 가
      # 그 자리에서 얼어붙는다. 경로가 모름 칸을 지나지 않으면 MPPI 도 거기 안 간다.
      #
      # 대가: 지도 내부에 모름 칸이 끼인 좁은 통로에서 계획이 실패할 수 있다. 조용히
      # 실패하지는 않는다 -- mock_explorer 는 '경로 계획 실패 -> goal 을 보내지 않는다'
      # 를 찍고, 탐색 서버는 /compute_path_to_pose 의 abort 를 받는다.
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      # SmacPlanner2D 는 방향을 내지 않는다. 전방향 베이스라 필요 없고, 마지막 접근
      # 방향을 강제하면 목표마다 제자리 회전이 하나 더 붙는다.
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      # 원 반경이 아니라 실측 footprint 다 (탐색 담당 요청, 2026-10-28). 50 x 54 cm,
      # base_link 를 기하 중심으로 가정한다. 내접 0.25 / 외접 0.368.
      #
      # **이유: robot_radius 0.37 은 이 건물을 17 조각으로 끊는다.** /map 자유 셀에
      # 거리 변환을 걸고 여유 >= t 인 셀을 8-연결로 묶어 보면 (ARCHITECTURE.md 16 장),
      # t = 0.37 에서 로봇이 있는 성분이 5,788 셀 = 14.5 m^2 이고 t = 0.25 에서
      # 884,093 셀 = 2,210 m^2 로 **합쳐진다**. 지도 잡음이 아니다 -- 17 개 중 5 셀
      # 이하가 4 개뿐이고 0.25 m^2 이상인 실제 구역이 6 개다.
      #
      # footprint 를 주면 nav2 는 robot_radius 를 무시한다 (use_radius_ = false).
      # 그래서 지웠다 -- 두 벌을 두면 어느 쪽이 사는지 설정만 보고 알 수 없다.
      # 문자열이어야 한다: nav2 는 이 파라미터를 string 으로 선언하고
      # makeFootprintFromString 으로 푼다. YAML 리스트로 주면 타입 불일치로 죽는다.
      footprint: "[[0.25, 0.27], [0.25, -0.27], [-0.25, -0.27], [-0.25, 0.27]]"
      resolution: 0.05
      global_frame: map
      robot_base_frame: base_link
      rolling_window: false
      track_unknown_space: false
      # 실시간 장애물 없음. 동료의 static costmap 과 같은 구성이고, 움직이는 장애물은
      # /local_costmap 이 담당한다 (MPPI 가 그쪽을 따로 구독한다).
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # MPPI 가 보는 비용은 ~= exp(-cost_scaling_factor * (d - inscribed)) 이고,
        # w_obs = 20 은 시뮬 grid.bake() 의 exp(-(d - 0.35)/0.15), 즉 유효 scale
        # 6.67 에 맞춰 튜닝됐다. 지수를 같게 맞춰 실기 비용장을 그 필드로 만든다.
        #
        # 이전 값(0.40/4.0)은 기울기 폭이 0.04 m 뿐인 사실상 계단함수였고, 두 증상이
        # 거기서 나왔다:
        #   (a) d > 0.41 m 가 전부 비용 0 -> cost_travel_multiplier 가 죽은 항이 되어
        #       A* 가 통로 중앙을 선호하지 않고 lethal 경계에 붙는 경로를 낸다.
        #   (b) MPPI 는 0.41 m 안에 들어오기 전까지 벽을 못 보다가 한 스텝 만에
        #       0 -> 0.89 -> 탈락(10.0)을 만난다. 그래서 경로와 싸운다.
        #
        # 통과 가능한 통로 폭의 하한은 robot_radius 가 아니라 **w_obs x 통로 중앙의
        # 비용**이 정한다. 반경은 '계획이 통과 가능이라고 보는가'만 정하고, MPPI 가
        # 실제로 들어가는지는 따로다. 합성 직선 통로 스윕 (실제 MPPI, seed 3 개 전원
        # 통과한 최소 폭, 2026-10-28, 통로 길이 3.0 / 0.6 / 0.2 m):
        #
        #   내접   w_obs    3.0 m    0.6 m    0.2 m
        #   0.37      20     1.00     1.00     0.90     <- 2026-10-06 의 1.05 재현
        #   0.37      12     0.85     0.85     0.85     <- 그때의 0.90 재현
        #   0.25      20     0.70     0.70     0.70     <- footprint 전환 후 (현재)
        #   0.25      12     0.65     0.65     0.65
        #
        # 하네스가 기록(1.05/0.90)을 한 칸(0.05 m) 낙관적으로 재현하므로 보정하면
        # 현재 설정의 하한은 약 0.75 m 다. 통로 길이는 거의 무관하다.
        #
        # **w_obs 는 내리지 않는다.** 내접 0.37 에서는 20 -> 12 가 0.15 m 를 벌었지만
        # 0.25 에서는 0.05 m 뿐이고, 가장 무거운 안전 항을 40 % 깎는 대가에 비해 남는
        # 것이 없다. w_goal 15 -> 25 도 정확히 같은 0.65 를 준다 (지배량은 w_goal/w_obs
        # 비다). 즉 footprint 전환이 사실상 전부를 해냈다.
        #
        # 미달 폭에서의 실패 모드는 **전원 STALL 이고 충돌은 0 건**이다: 로봇이 통로
        # 입구 0.4~0.6 m 앞에서 서고 들어가지 않는다 (x_max 1.38~1.64). 실기의
        # NO_PROGRESS 와 같은 서명이다.
        #
        # 대가: 같은 거리에서 비용이 exp(-6.67 * 0.12) = 0.45 배로 낮아진다. 비용장이
        # '로봇이 0.12 m 작아진 것처럼' 보이므로 열린 공간에서의 벽 이격도 그만큼
        # 줄어든다. **횡오차 실측치가 없다** -- 가진 것은 명령 대비 방향오차
        # (p50 2.7 deg / p90 8.7 deg) 와 최종 위치오차뿐이고, 경로 횡오차는 재지
        # 않았다. 실기 세션에서 c_seg / c_robot 분포로 이격을 직접 확인할 것.
        #
        # inflation_radius 는 lethal 셀을 만들지 않는다 (lethal 은 inscribed_radius
        # 에서만 나온다). 따라서 **플래너의 통과 가능성 자체는 불변**이다.
        inflation_radius: 1.05      # 비용이 0.01 로 떨어지는 거리
        cost_scaling_factor: 6.67   # = 1/0.15, 시뮬 decay 와 동일
        # footprint 전환 검증 (2026-10-28, 격리 도메인 99 에 장애물 한 칸짜리 합성
        # /map 을 주고 planner_server 가 낸 /global_costmap/costmap 을 되읽었다):
        #   occ >= 99 ("확실히 충돌") 최대 거리  0.255 m   <- 내접 0.25 + 반 칸
        #   occ == 100 (진짜 lethal)            장애물 셀 그 자체뿐
        #   감쇠 적합  occ/98 = exp(-6.68 d + 1.72)  -> scale 6.68, 내접 0.258 m
        #   1..98 띠 범위  0.269 ~ 1.050 m       <- inflation_radius 와 정확히 일치
        # nav2 가 문자열 footprint 를 받아 내접을 0.25 로 계산했고, 99 와 100 이
        # 구별된다 (자세별 footprint 검사가 쓸 raw lethal 채널이 실제로 존재한다).
      always_send_full_costmap: True
      # update 가 publish 보다 커야 전달률이 안 깎인다 (전달률 = update / ceil(update/publish)).
      update_frequency: 2.0
      # 한 장이 748 x 1318 셀 = 약 0.94 MB 다 (always_send_full_costmap 이므로 매번 전량).
      # 탐색 담당이 자기 planner_server 를 끄고 이 토픽을 Wi-Fi 건너로 구독하기로 했다
      # (2026-10-28). 1.0 Hz 면 그것만으로 0.94 MB/s 이고, 지금 링크 전체가 약
      # 0.24 MB/s 다 (동료 static 0.16 + local 0.08) -- 4 배가 된다. 그 링크는 이미
      # 로밍으로 2 초씩 끊기고, 10/26 미도달 10 건 중 3 건이 그 끊김이었다.
      #
      # 구조물 지도라 내용이 바뀌지 않으므로 다시 보낼 이유가 없다. always_send_full_costmap
      # 을 False 로 돌리는 쪽은 안 된다 -- 우리 MPPI 가 .../costmap_updates 를 구독하지
      # 않아서 첫 장 이후로 굶는다. 그래서 주기를 낮추는 것이 맞는 레버다.
      # 구독자는 transient local 로 받으면 붙는 즉시 한 장을 받는다. 우리 static_stale
      # 은 30.0 이고 판정도 메시지 stamp 가 아니라 수신 시각으로 하므로 여유가 크다.
      publish_frequency: 0.2
