# 실기 연동용 navigate_to_goal 파라미터. 동료 PC 의 SLAM/costmap 과 같은 도메인(25)에서
# 돌린다. 시뮬과 무관하다 -- use_sim_time 은 false 이고 /clock 은 존재하지 않는다.
#
# **임계값 셋은 무선 경유 테스트 전용이다.** 2026-10-02 실측:
#   TF map->base_link 나이  p50 0.279  p90 0.580  p99 1.364  최대 1.652 s
#   /local_costmap/costmap  3.27 Hz, 최대 간격 1.18 s
#   /mppi_static_costmap    0.65 Hz, 최대 간격 2.59 s
# 기본값(tf_timeout 0.5, local_stale 1.0)으로는 10 % 주기에서 abort 가 난다. 그래서
# 올려 두었지만, 그것은 **0.3~1.6 s 묵은 pose 로 제어한다**는 뜻이다. 0.5 m/s 에서
# 1.6 s 는 0.8 m 틀린 위치다. 실주행은 로봇 PC 에서 돌려야 하고, 그때는 이 세 값을
# 원래대로 (0.5 / 1.0 / 3.0) 되돌릴 것.
navigate_to_goal:
  ros__parameters:
    use_sim_time: false

    # 입력
    # 우리 planner 의 global_costmap 을 쓴다 -- 동료의 /mppi_static_costmap 이 아니다.
    # 경로를 만드는 비용장과 회피하는 비용장이 **같은 한 장**이어야 MPPI 가 경로와
    # 싸우지 않는다. 출처는 동일하다: 둘 다 동료의 /map 에서 만들어진다.
    # 대가: planner_server 가 죽으면 MPPI 도 static 을 잃고 멈춘다 (static_stale 이
    # 잡는다). 어차피 같은 터미널에서 띄우는 프로세스다.
    # QoS 는 바꿀 필요가 없다 -- 같은 nav2_costmap_2d 발행자라 동료 것과 같다.
    # 전달률 = update 2.0 / ceil(2.0/1.0) = 1.0 Hz, static_stale 30.0 안에 들어온다.
    static_costmap_topic: /global_costmap/costmap
    local_costmap_topic: /local_costmap/costmap
    global_frame: map
    base_frame: base_link
    # 속도 추정 전용. map->base_link 에 섞이는 ICP 보정 점프를 피한다.
    velocity_frame: camera_init

    # 출력. **기본값이 dry-run 토픽이다.** 실제 /cmd_vel 로 내보내려면 실행할 때
    # 명시적으로 덮어써야 한다 -- 라우터가 동료와 연결된 상태에서 /cmd_vel 을 내면
    # 실제 로봇이 움직인다.
    cmd_vel_topic: /cmd_vel_dryrun

    solve_frequency: 10.0
    publish_frequency: 10.0     

    # 감시 임계 (위 주석 참조)
    input_wait: 2.0
    tf_timeout: 2.0
    local_stale: 2.0
    static_stale: 30.0          # 구조물 지도라 내용이 안 바뀐다. 발행자 사망만 잡는다
    # local_stale 로 죽을 때 같은 tick 의 tf_age 가 이 값을 넘으면 localization_lost 로
    # 보고한다. local costmap 이 3 Hz 라 정상에서도 0.33 s 밀려 있어 local_stale 이
    # tf_timeout 보다 항상 먼저 터진다 -- 2026-10-27 실기 3/3 건이 그 시점 tf_age
    # 1.438 / 1.626 / 1.728 로 2.0 미달이라 전부 internal 로 나갔고, Wi-Fi 로밍으로
    # 위치를 잃은 것이 costmap 문제로 보고됐다. 0.5 는 측위 담당 권고값이다.
    tf_stale_hint: 0.5

    # 액션 프론트엔드
    action_name: /athome/navigate_to_goal
    heartbeat_topic: /athome/executor/heartbeat
    heartbeat_timeout: 2.0
    robot_config: demo.yaml
    map_version: ''             # 팀 형식 미합의 -> 빈 값이면 검사 생략

    # 무선 경유 안전: 병진 0.2 m/s, 회전 0.6 rad/s 로 낮춘다. TF 가 최대 1.65 s 묵는
    # 구간이 있는데 1.0 rad/s 면 그 사이 95 도가 돌고, 0.5 m/s 면 0.8 m 틀린 위치를
    # 제어한다. **0.5 는 로봇 PC 로 옮긴 뒤에 쓴다** (파일 머리의 0.5/1.0/3.0 복원과 함께).
    #
    # sigma_w: v_max_wz 를 0.6 으로 내리면 기본 sigma[2] = 0.6 이 한계와 같아져 ω 샘플의
    # 32 % 가 _limit 에 클리핑된다 (P(|N(0,0.6)| > 0.6)). 기본 비 0.6/1.0 을 복원해
    # 4.6 % 로 내린다. 실측 |ω_cmd| p50 은 0.070 rad/s = 한계의 12 % 였다.
    #
    # w_head 는 여기서 올리지 않는다 -- 시뮬 A/B 결과를 보고 결정한다.
    # K 를 바꾸려면 eta_min/eta_max 도 함께 바꿔야 한다: 25.6/51.2 는 K=512 의 5~10 %
    # 로 고른 값이고, K 만 줄이면 밴드가 K 의 수십 % 가 되어 softmax 가 거의 균등해져
    # 명령이 안 나온다 (K=64 로 확인). MPPIConfig 의 assert 는 이것을 잡지 못한다.
    mppi_overrides: "v_max_xy=0.5 v_max_wz=0.5 sigma_w=0.3 w_head=2.0"

    unknown: free
    lookahead_dist: 0.75
    goal_switch_dist: 0.75
    carrot_skip_max: 2.0
    blocked_time: 3.0
    decel_limit: 1.0
    # 각속도 램프는 선형과 분리한다. 공용 1.0 rad/s^2 면 램프가 ω^2/(2*1.0) 만큼 더
    # 쓸어내고, 실측 마지막 uw 0.341 rad/s 에서 3.33 deg 다. 탐색 회전의 허용 오차가
    # +-5.3 deg 라 그 하나로 예산의 63 % 를 쓴다. 베이스 각가속 한계 3.14 바로 아래인
    # 3.0 으로 두면 같은 ω 에서 1.11 deg 가 된다.
    decel_limit_w: 3.0
    # 최종 접근 ω 캡 (rotating phase 에서만). MPPI 는 목표 yaw 근처에서 감속하지 않아
    # 멈추기로 결정하는 순간에도 ω 가 순항에 붙어 있다 (실측 0.341 vs 순항 0.357).
    # 결정 이후 쓸어내는 각도 = 램프 ω^2/(2*decel_limit_w) + 판정 지연 ω*0.17 이고
    # (0.17 s = TF 전송 0.07 + tick 0.1), 캡 없이는 1.11 + 3.3 = 4.4 deg 로 여유가
    # 0.9 deg 뿐이다. 0.20 으로 묶으면 0.38 + 1.95 = 2.3 deg. 대가는 마지막 15 deg 가
    # 0.81 -> 1.3 s, 회전당 +0.5 s 다.
    yaw_approach: 0.26
    w_approach: 0.20
    stop_speed: 0.02
    stop_yaw_rate: 0.05
    stop_hold: 0.2
    stop_timeout: 3.0
    # 0.3 -> 1.0. camera_init->base_link 로 바꾼 뒤에도 잔여 노이즈가 p50 0.0200 /
    # 최대 0.0507 m/s 로 stop_speed 0.02 에 걸쳐, 정지 판정이 완성되지 않았다 (실측).
    # 창을 늘려 **노이즈를 줄인다** -- 임계를 올려 노이즈를 참는 것과 다르다.
    # vel_window 는 _velocity() 한 곳에서만 쓰이고 그 결과는 정지 판정과 진단 CSV
    # 에만 쓰인다. MPPI.step() 은 속도를 받지 않으므로 제어에는 영향이 없다.
    vel_window: 1.0
    # 주행 중 heading 기준. 'goal' 이면 **이전과 완전히 같다** (목표의 최종 yaw 고정).
    # 'path' 면 캐럿 지점의 경로 접선 yaw 를 쓰고 goal_switch_dist 안에서 목표 yaw 로
    # 전환한다. 비용장 변경 효과와 섞이지 않게 이 값만 바꿔 A/B 한다.
    # 시뮬 A/B (2026-10-06, 40 에피소드) 결과로 path 를 채택했다:
    #   접선 대비 yaw 오차 p50  59.2 deg (goal) -> 7.8 deg (path, w_head 2.0)
    #   도달 17.4 -> 17.9 s, 충돌 0, fallback 0, 경로 이탈 변화 없음
    #   w_head 만 올리는 것은 역효과: goal 기준에 3.0 을 주면 76.8 deg 로 악화된다
    # w_head 2.0 을 고른 이유: 3.0/4.0 은 오차를 6.0/4.5 deg 로 더 줄이지만
    # goal_switch 전환의 jerk_w 가 1.29 -> 1.44 -> 1.73 으로 커진다. 전환 직전
    # goal yaw 오차가 ~50 deg 라 거기서 한 번에 돌아야 하고 (ω 피크 0.64~0.75 rad/s,
    # 실기 v_max_wz 0.6 을 넘어 포화된다), TF 가 0.3~1.6 s 묵는 링크에서는 완만한
    # 쪽이 맞다. 전환을 접근 구간에 펴는 블렌딩은 다음 배치 후보다.
    heading_ref: path
    tangent_span: 0.30          # m, 접선을 재는 현의 길이 (격자 6 칸)
    # Biased-MPPI (arXiv:2401.09241). 시뮬 A/B 96 에피소드 (2026-10-07) 로 채택했다:
    #   도달 15/18 -> 18/18,  t_solve p50 16.4 -> 15.1 s,  접선 yaw 3.3 -> 2.9 deg
    #   clutter(명목해가 막히는 유일한 시나리오) 0/3 -> 3/3, 정체 6.5 s -> 0 s
    # 대가: mppi_ms p50 +1.8 ms (예산 100 ms), ω jerk **max** 2.15 -> 3.92
    #       (p95 는 0.67 -> 0.71 로 불변 -- 드문 스파이크다, 아래 참조).
    #
    # 기구는 간헐적으로 작동한다. w_path 의 p50 은 0.031 뿐이지만 w_path > 0.05 인
    # tick 이 40 % 이고 최대 0.471 이다 -- 비용이 오르는 구간마다 ancillary 가
    # 명목해를 전진 쪽으로 밀고, 쉬운 구간은 warm start 가 운반한다.
    biased: true
    anc_ramp_frac: 0.5
    # ω 추종 진단 전용. '' 이면 구독하지 않는다.
    odom_topic: ''
    rot_w_head: 40.0
    rot_w_goal: 60.0
    viz: true
    viz_samples: 24
    log_timing: true
    log_prefix: real
