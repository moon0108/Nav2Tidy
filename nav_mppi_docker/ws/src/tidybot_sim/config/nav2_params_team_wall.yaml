# nav2_params_team.yaml 위에 얹는 A/B 오버레이. **inflation 두 값만 다르다.**
#
#   ros2 launch tidybot_sim nav2.launch.py controller:=team \
#        team_overlay:=nav2_params_team_wall.yaml
#
# 실기 이전 값(0.40 / 4.0)을 재현한다: inscribed 0.37 에서 0.41 m 까지 폭 0.04 m 의
# 사실상 계단함수이고, 그래서 (a) 플래너에 통로 중앙 선호가 없어 경로가 lethal 경계에
# 붙고 (b) MPPI 가 0.41 m 안에 들어오기 전까지 벽을 못 본다. Biased-MPPI A/B 의
# "벽에 붙은 경로"(on-wall) 조건이다.
#
# 전에는 276 줄 사본이었다. 사본은 원본의 나머지 274 줄과 조용히 드리프트하고,
# 그러면 A/B 가 inflation 외의 차이까지 재게 된다. ROS 2 는 parameters 리스트에서
# 뒤에 온 파일이 앞을 덮으므로 바꿀 값만 적으면 된다.
#
# 두 섹션 모두 필요하다: global_costmap 은 planner_server 가 들고 있는 것이고,
# costmap 은 team 모드에서 local costmap 을 내는 standalone nav2_costmap_2d 다.
# 자기 섹션이 아닌 노드는 이 파일을 무시한다.

global_costmap:
  global_costmap:
    ros__parameters:
      inflation_layer:
        inflation_radius: 0.40
        cost_scaling_factor: 4.0

costmap:
  costmap:
    ros__parameters:
      inflation_layer:
        inflation_radius: 0.40
        cost_scaling_factor: 4.0
